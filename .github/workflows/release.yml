# Generated-By: Codex / gpt-6-astra
name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: llmsvc-release-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'SYandong/LLM-service-manager' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install isolated build backend
        run: python -m pip install 'setuptools==84.0.0' 'wheel==0.48.0'
      - name: Verify trusted evidence, build and publish exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python release/publish.py --event "$GITHUB_EVENT_PATH" --work "$RUNNER_TEMP/release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain exact build bytes for interrupted uploads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/*
          if-no-files-found: ignore
          retention-days: 7
