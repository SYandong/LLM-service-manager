# Generated-By: Codex / gpt-6-astra
# Bind a specific container address in deployment; loopback is for local checks.
listen_host: 127.0.0.1
listen_port: 8011
# Default blocks all live writes. Explicit false plus state_db_path enables pin/unpin and reserve intent writes.
# --dry-run, --once and --check-config force read-only access and never create a database.
read_only: true
sample_interval_seconds: 15
# Bounded, process-local SSE history; persistent events arrive in M2.
event_history_size: 1000
event_heartbeat_seconds: 15
request_timeout_seconds: 10
# GiB. Candidate thresholds pending the production stakeholder gate.
memory_budget_gb: 200
host_min_available_gb: 150
# No probes configured: state explicitly reports collectors_not_configured.
# Telemetry supplies build_collector(mapping) and the probe configuration.
collectors: {}
# With read_only: true this must exist and opens read-only; empty disables intent reads.
# With explicit read_only: false the configured database may be created for intent writes.
state_db_path: ""
max_snapshot_age_seconds: 30
# Model transports remain disabled separately from pin intent writes.
# Also gates placement-victim stops when placement_enabled is explicitly true.
# Isolated opt-in requires read_only: false and a populated collectors model/unit catalog.
model_actions_enabled: false
free_timeout_seconds: 120
# One total reserve evacuation deadline; intent persists on blocked/partial outcomes.
reserve_timeout_seconds: 120
wake_timeout_seconds: 900
action_observe_seconds: 10
action_poll_seconds: 0.2

# Placement is a separate opt-in; existing pin/free/wake installs do not enable it.
# Requires trusted collectors.models weights/util, host memory and a writable state_db_path.
placement_enabled: false
placement_wait_seconds: 120
# Match the launcher's startup timeout (15 minutes by default).
lease_timeout_seconds: 900
# Per-inspection cap and per-round reconciliation budget; every probe is read-only.
lease_probe_seconds: 1

# Optional UI-only source relay into the existing /v1/events stream.
# Requires collectors.swap_url and an explicit collectors.models allowlist.
# Does not enable placement/actions or make data-plane events trusted for quiet.
data_plane_events_enabled: false
data_plane_event_capacity: 256
data_plane_event_batch_size: 128
data_plane_event_interval_seconds: 0.2
data_plane_event_timeout_seconds: 2
data_plane_event_reconnect_seconds: 1
